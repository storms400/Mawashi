name: Android CI

on:
  push:
    branches:
      - "develop/**"
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mawashi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found in ANDROID_HOME or PATH"
            exit 1
          fi
          timeout 3m bash -c 'yes | "$1" --licenses' _ "$SDKMANAGER"
          NEEDS_INSTALL=false
          [ -d "$ANDROID_HOME/platforms/android-35" ] || NEEDS_INSTALL=true
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || NEEDS_INSTALL=true
          if [ "$NEEDS_INSTALL" = true ]; then
            timeout 8m "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" --verbose
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify independent v32 package and cartoon icon
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='dz.mawashi.app.independent.v32.debug'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='32' versionName='1.0.32-debug'"
          unzip -l "$APK" | grep -F "mawashi_launcher_cartoon"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawashi-Debug-APK-v32
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
