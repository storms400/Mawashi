name: Android CI # v53 unique package verification

on:
  push:
    branches:
      - "develop/**"
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mawashi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found in ANDROID_HOME or PATH"
            exit 1
          fi
          timeout 3m bash -c 'yes | "$1" --licenses' _ "$SDKMANAGER"
          NEEDS_INSTALL=false
          [ -d "$ANDROID_HOME/platforms/android-35" ] || NEEDS_INSTALL=true
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || NEEDS_INSTALL=true
          if [ "$NEEDS_INSTALL" = true ]; then
            timeout 8m "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" --verbose
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify unique package identity and Firebase registration for v53
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          target = "dz.mawashi.app.independent.v53"
          previously_used = {
              "dz.mawashi.app",
              "dz.mawashi.app.test",
              "dz.mawashi.app.test2",
              "dz.mawashi.app.independent.v37",
              "dz.mawashi.app.independent.v38",
              "dz.mawashi.app.independent.v49",
              "dz.mawashi.app.independent.v50",
              "dz.mawashi.app.independent.v51",
              "dz.mawashi.app.independent.v52",
          }
          assert target not in previously_used, "v53 package ID was already used"
          for filename in ("app/google-services.json", "app/src/standalone/google-services.json"):
              data = json.loads(Path(filename).read_text())
              packages = [
                  client.get("client_info", {}).get("android_client_info", {}).get("package_name")
                  for client in data.get("client", [])
              ]
              assert packages.count(target) == 1, (
                  f"{filename} must contain exactly one registered Firebase Android client for {target}; "
                  f"found {packages.count(target)}"
              )
              assert len(packages) == len(set(packages)), f"{filename} contains duplicate Firebase package registrations"
          print("v53 package identity is unique and registered in both Firebase configuration files")
          PY

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify final package identity and cartoon icon
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='dz.mawashi.app.independent.v53'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='53' versionName='1.0.53-debug'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources "$APK" | grep -F "mawashi_launcher_cartoon"

      - name: Build independently installable APK
        run: gradle --no-daemon :app:assembleStandalone

      - name: Verify independent package and cartoon icon
        run: |
          APK="app/build/outputs/apk/standalone/app-standalone.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='dz.mawashi.app.independent.v53'"
          unzip -l "$APK" | grep -F "mawashi_launcher_cartoon"

      - name: Verify standalone APK uses the standard debug signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/standalone/app-standalone.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='dz.mawashi.app.independent.v53'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='53' versionName='1.0.53-test3'"

      - name: Upload independently installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawashi-Standalone-Independent-v53
          path: app/build/outputs/apk/standalone/app-standalone.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawashi-Debug-APK-v53
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
